version: 2.1

jobs:
  shouldWakeSpan:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Tagging NET 5773
          command: |
            mkdir -p /var/tmp/beta1
            set +o pipefail 2>/dev/null; cat <(seq 1 687067 | md5sum) <(seq 1 687067 | sha1sum) > /var/tmp/beta1/batch-12k; true
            echo "wrote variant-d"
      - persist_to_workspace:
          root: /var/tmp/beta1
          paths:
            - 'batch-12k'
  prometheus-rev:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/beta1
      - run:
          name: Fetch gate fixture
          command: |
            cat /var/tmp/beta1/batch-12k 2>/dev/null | tr -s ' ' '\n' | awk '{print length,$0}' | sort -rn | head -3 || true
      - run:
          name: Fetch minimal
          command: git clone --depth 1 --quiet --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Rehydrate tree
          command: tar --extract -f pending-crate.tar
      - run:
          name: Package artifacts
          command: free -m
      - run:
          command: cat /proc/cpuinfo | head -5
      - run:
          command: ./encode-main
  lock_total:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /var/tmp/beta1
      - run:
